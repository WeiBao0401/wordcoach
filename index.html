<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Coach</title>
<style>
:root { --paper: #E9F4EC; --ink: #16302A; --accent: #1E7A55; }
@media (prefers-color-scheme: dark) { :root { --paper: #0F1D19; --ink: #E4F1EA; --accent: #5FC79A; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; padding: 16px; text-align: center; }
a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <p>Word Coach 正在做，先打开体检页</p>
  <p><a href="/wordcoach/check/">打开 Word Coach 体检</a></p>
</main>
<script>
// Until the real app ships, every address under /wordcoach/ leads to the check page
// (covers a missing "check/", a capital letter, or punctuation pasted after the link).
location.replace('/wordcoach/check/');
</script>
</body>
</html>
